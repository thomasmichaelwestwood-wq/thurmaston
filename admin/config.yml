      - { label: "Date", name: "date", widget: "muted-string", hint: "Shown under the photo, e.g. \"Added July 2026\" — replace with a real date if one becomes known, e.g. \"c.1936\"." }
      - { label: "Credit", name: "credit", widget: "muted-string", required: false, hint: "Who took or contributed the photo, if known." }
