# Switched from git-gateway (Netlify Identity) to a direct GitHub
# backend — Sveltia CMS (see admin/index.html) doesn't support Git
# Gateway. Netlify hosts the OAuth callback for this automatically
# (no custom serverless function needed) once a GitHub OAuth App is
# registered and its Client ID/Secret are entered into the site's own
# Netlify dashboard settings — a one-time, account-level setup step,
# not something in this repo.
backend:
  name: github
  repo: thomasmichaelwestwood-wq/thurmaston
  branch: main

# No editorial workflow (draft/review step) — matches the rest of the
# site's "single trusted uploader, no approval gate" approach. Saving in
# the CMS commits straight to `main` and Netlify redeploys automatically.
publish_mode: simple

# Any images uploaded directly through the CMS (not synced from Google
# Drive) land here, kept separate from the automated Drive→GitHub photo
# pipeline's own images/photos/<category>/ and images/hero-photos folders.
media_folder: "images/cms-uploads"
public_folder: "/images/cms-uploads"

# One collection per category, each saving into its own real folder
# (data/photos/<category>/ for the entry, images/photos/<category>/ for
# the photo itself) rather than one flat "Photos" collection — requested
# explicitly, so the folders you see in the repo/media library actually
# match the six categories used throughout the site (the category pages,
# the photo filters, etc). Decap's image widget can't route an upload
# into a folder based on another field's value (e.g. picking a category
# from a dropdown) — the folder has to be fixed per field/collection —
# which is why this is six collections rather than one collection with a
# smarter upload widget. "Streets & Buildings" is listed first since
# Decap opens the first-listed collection by default on login, and it's
# the largest/most-used category.
collections:
  - name: "photos_aerial"
    label: "Aerial"
    description: "Every photo in the Aerial category, one entry per photo. Photos still sync in automatically from Google Drive as before — but you can also add one straight from here: upload the image, then fill in what you know. Edit caption, credit, location, and history freely on any photo; leave fields marked \"Internal\" alone unless you know what you're doing."
    folder: "data/photos/aerial"
    create: true
    delete: true
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}-{{slug}}"
    extension: "json"
    format: "json"
    identifier_field: "caption"
    fields:
      - label: "Photo"
        name: "src"
        widget: "image"
        media_folder: "/images/photos/aerial"
        public_folder: "/images/photos/aerial"
        hint: "For a new photo: upload the image file here. For an existing one, this shows the current image — leave it alone unless you're replacing the file."
      - { label: "Caption", name: "caption", widget: "string", hint: "The photo's name, shown on the site. Usually fine as synced — tweak it if it reads oddly." }
      - label: "Category"
        name: "category"
        widget: "hidden"
        default: "aerial"
        # Fixed to match this collection/folder — not shown as a field to
        # fill in, since which collection you're already in decides it.
        # A hidden widget still writes its default into the saved JSON,
        # so photo.category keeps working everywhere the front end reads
        # it (category.html, the photo filters, js/map.js's pin colour).
      - { label: "Date", name: "date", widget: "string", hint: "Shown under the photo, e.g. \"Added July 2026\" — replace with a real date if one becomes known, e.g. \"c.1936\"." }
      - { label: "Credit", name: "credit", widget: "string", required: false, hint: "Who took or contributed the photo, if known." }
      - label: "Google Maps coordinates"
        name: "coords"
        widget: "string"
        required: false
        hint: "On Google Maps, right-click the exact spot — the coordinates appear at the top of the menu that pops up. Click them to copy, then paste here, e.g. \"52.679363, -1.097994\". Leave blank if the location isn't known — this puts the photo on the map automatically, using this photo's own caption/date/credit. No need to also add a Map Pin for it — that's only for a pin that needs its own separate name/description."
        # The leading "^$|" lets an empty value through the pattern
        # check, here and on every other Coordinates field in this
        # file. Sveltia always saves a real empty string for a blank
        # optional field — required: false only makes it optional to
        # *type*, not optional in the saved output — so without this,
        # that empty string still had to match the pattern below
        # (which needs at least one digit), and leaving Coordinates
        # blank silently failed to save, exactly as if the field were
        # required after all.
        pattern: ['^$|-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?', "Must be two numbers separated by a comma, e.g. 52.679363, -1.097994"]
      - { label: "Location", name: "location", widget: "string", required: false, hint: "e.g. \"Garden Street\" — leave blank if not known. Just descriptive text shown next to the photo — set Google Maps coordinates above to actually place it on the map." }
      - { label: "History", name: "history", widget: "text", required: false, hint: "What's known about this photo — shown in full when the photo is opened." }
      - { label: "Consent noted", name: "consentNoted", widget: "boolean", default: false, hint: "Tick once you've confirmed it's OK to show identifiable people in this photo." }
      - { label: "Internal — reference code", name: "ref", widget: "string", required: false, hint: "Shown as a small \"Ref:\" tag on the photo. For Drive-synced photos this is filled in automatically from Dad's original filing name. For a photo added here, it's filled in automatically from the uploaded file's name if you leave this blank." }
      - { label: "Internal — manual place grouping", name: "placeId", widget: "string", required: false, hint: "Leave blank — photos already group together automatically (matching Google Maps coordinates, or Location text if there are no coordinates). Only fill this in for two photos that are definitely the same place but won't group automatically — e.g. an old photo whose street was renamed since, with no coordinates known and Location typed using the old street name. Type anything here (e.g. the place's name) — the exact same text on every photo of that place — to force them to group together regardless of what their coordinates or Location say." }
      - { label: "Internal ID", name: "id", widget: "string", required: false, hint: "Never shown on the site. Leave blank — it's set automatically from this entry's filename when the site rebuilds." }
      - { label: "Internal — added", name: "addedAt", widget: "string", required: false, hint: "Controls sort order in the archive (newest first). Leave blank on a new photo — it's filled in automatically." }

  # A single hand-curated list (data/chronology.json), not one file per
  # entry — same shape the old "Map pins" collection used before it was
  # removed from the admin (see js/map.js's own comment on that file).
  # Fits a village history list well: a few hundred entries at most,
  # small enough to load and edit as one whole list rather than needing
  # per-entry files plus a rebuild-and-aggregate script the way Photos
  # and Event Pages do. js/chronology.js reads this file directly.
  - name: "chronology"
    label: "Village Chronology"
    description: "The village's year-by-year timeline, shown at /chronology.html. Add a new entry anywhere in the list for anything recent — order doesn't matter when saving, the page sorts everything into year order itself — or edit/delete one that's already here."
    files:
      - name: "chronology"
        label: "Village Chronology"
        file: "data/chronology.json"
        fields:
          - label: "Timeline entries"
            name: "entries"
            widget: "list"
            summary: "{{fields.year}} — {{fields.text}}"
            fields:
              - { label: "Year", name: "year", widget: "string", hint: "e.g. \"1929\", \"1920s\", \"c1870\", \"1848/9\" — whatever's known, doesn't need to be one exact year." }
              - { label: "What happened", name: "text", widget: "text", hint: "A short description of what happened." }

  - name: "photos_events"
    label: "Events (single photos)"
    description: "For a one-off Events photo that isn't part of a described occasion — every photo here, one entry per photo. Photos still sync in automatically from Google Drive as before — but you can also add one straight from here: upload the image, then fill in what you know. Edit caption, credit, location, and history freely on any photo; leave fields marked \"Internal\" alone unless you know what you're doing. For an event with several photos and its own write-up (e.g. Remembrance Day), use the \"Event Pages\" collection instead — one entry there covers the whole occasion, photos and all."
    folder: "data/photos/events"
    create: true
    delete: true
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}-{{slug}}"
    extension: "json"
    format: "json"
