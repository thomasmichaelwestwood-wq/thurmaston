    create: true
    delete: true
    nested:
      depth: 100
      summary: "{{caption}}"
    meta:
      path:
        widget: "string"
        label: "Event / Year folder"
        hint: "Leave blank for a one-off Events photo. To group a recurring event, type \"<Event name>/<year>\" — e.g. \"Remembrance Day Parade/2020\" — using the exact same event name each year (spelling/capitalisation included) so they land in the same folder and group together on the site. Just \"<Event name>\" with no year is fine too if the year isn't known yet."
        index_file: "index"
