# Switched from git-gateway (Netlify Identity) to a direct GitHub
# backend — Sveltia CMS (see admin/index.html) doesn't support Git
# Gateway. Netlify hosts the OAuth callback for this automatically
# (no custom serverless function needed) once a GitHub OAuth App is
# registered and its Client ID/Secret are entered into the site's own
# Netlify dashboard settings — a one-time, account-level setup step,
# not something in this repo.
backend:
  name: github
  repo: thomasmichaelwestwood-wq/thurmaston
  branch: main

# No editorial workflow (draft/review step) — matches the rest of the
# site's "single trusted uploader, no approval gate" approach. Saving in
# the CMS commits straight to `main` and Netlify redeploys automatically.
publish_mode: simple

# Any images uploaded directly through the CMS (not synced from Google
# Drive) land here, kept separate from the automated Drive→GitHub photo
# pipeline's own images/photos/<category>/ and images/hero-photos folders.
media_folder: "images/cms-uploads"
public_folder: "/images/cms-uploads"

# One collection per photo category, each saving into its own real
# folder (data/photos/<category>/ for the entry, images/photos/<category>/
# for the photo itself) rather than one flat "Photos" collection —
# requested explicitly, so the folders you see in the repo/media library
# actually match the six categories used throughout the site (the
# category pages, the photo filters, etc). Decap's image widget can't
# route an upload into a folder based on another field's value (e.g.
# picking a category from a dropdown) — the folder has to be fixed per
# field/collection — which is why this is six collections rather than
# one collection with a smarter upload widget.
#
# Every collection below (not just the six photo ones) is listed
# alphabetically by its label — which also means whichever collection
# is alphabetically first is what opens by default on login (Decap/
# Sveltia both just open the first-listed collection); currently that's
# Aerial. Keep new collections in alphabetical order when adding one.
collections:
  - name: "photos_aerial"
    label: "Aerial"
    description: "Every photo in the Aerial category, one entry per photo. Photos still sync in automatically from Google Drive as before — but you can also add one straight from here: upload the image, then fill in what you know. Edit caption, credit, location, and history freely on any photo; leave fields marked \"Internal\" alone unless you know what you're doing."
    folder: "data/photos/aerial"
    create: true
    delete: true
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}-{{slug}}"
    extension: "json"
    format: "json"
    identifier_field: "caption"
    fields:
      - label: "Photo"
        name: "src"
        widget: "image"
        media_folder: "/images/photos/aerial"
        public_folder: "/images/photos/aerial"
        hint: "For a new photo: upload the image file here. For an existing one, this shows the current image — leave it alone unless you're replacing the file."
      - { label: "Caption", name: "caption", widget: "string", hint: "The photo's name, shown on the site. Usually fine as synced — tweak it if it reads oddly." }
      - label: "Category"
        name: "category"
        widget: "select"
        default: "aerial"
        options:
          - { label: "Aerial", value: "aerial" }
          - { label: "Churches & Religious Buildings", value: "churches" }
          - { label: "Events", value: "events" }
          - { label: "Groups & Organisations", value: "groups" }
          - { label: "Industry", value: "industry" }
          - { label: "Nature & Views", value: "nature" }
          - { label: "Other", value: "other" }
          - { label: "People", value: "people" }
          - { label: "Schools", value: "schools" }
          - { label: "Sports", value: "sports" }
          - { label: "Streets & Buildings", value: "streets" }
        hint: "Which collection this photo belongs to. Filed under the wrong one? Change this and save — the live site updates immediately (category page, photo filters, map pin colour all read this field directly), and the photo's file relocates itself into the correct collection automatically within about a minute, the same background job that already rebuilds the photo archive after any edit."
      - { label: "Date", name: "date", widget: "string", hint: "Shown under the photo, e.g. \"Added July 2026\" — replace with a real date if one becomes known, e.g. \"c.1936\"." }
      - { label: "Credit", name: "credit", widget: "string", required: false, hint: "Who took or contributed the photo, if known." }
      - label: "Google Maps coordinates"
        name: "coords"
        widget: "string"
        required: false
        hint: "On Google Maps, right-click the exact spot — the coordinates appear at the top of the menu that pops up. Click them to copy, then paste here, e.g. \"52.679363, -1.097994\". This puts the photo on the map automatically, using this photo's own caption/date/credit — and it's also how the site automatically links this photo to every other photo of the exact same place, even if their Location text below is worded differently. Always add these when you can, rather than just typing something into Location. No need to also add a Map Pin for it — that's only for a pin that needs its own separate name/description. Leave blank if the location genuinely isn't known."
        # The leading "^$|" lets an empty value through the pattern
        # check, here and on every other Coordinates field in this
        # file. Sveltia always saves a real empty string for a blank
        # optional field — required: false only makes it optional to
        # *type*, not optional in the saved output — so without this,
        # that empty string still had to match the pattern below
        # (which needs at least one digit), and leaving Coordinates
        # blank silently failed to save, exactly as if the field were
        # required after all.
        pattern: ['^$|-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?', "Must be two numbers separated by a comma, e.g. 52.679363, -1.097994"]
      - { label: "Location", name: "location", widget: "string", required: false, hint: "e.g. \"Garden Street\" — leave blank if not known. Just descriptive text shown next to the photo — set Google Maps coordinates above to actually place it on the map." }
      - { label: "History", name: "history", widget: "text", required: false, hint: "What's known about this photo — shown in full when the photo is opened." }
      - { label: "Consent noted", name: "consentNoted", widget: "boolean", default: false, hint: "Tick once you've confirmed it's OK to show identifiable people in this photo." }
      - { label: "Internal — reference code", name: "ref", widget: "string", required: false, hint: "Shown as a small \"Ref:\" tag on the photo. For Drive-synced photos this is filled in automatically from Dad's original filing name. For a photo added here, it's filled in automatically from the uploaded file's name if you leave this blank." }
      - { label: "Same place as another photo (if it won't link up on its own)", name: "placeId", widget: "string", required: false, hint: "Use this only when a photo of a place won't automatically link up with another photo of the exact same place — most often an old photo from when a street had a different name (Melton Road used to be Main Street), where you don't have map coordinates for the old photo, so its Location text alone can't match a modern one. Type anything here — a building's name is easiest — and type the exact same words on every photo of that place, to link them together no matter what their coordinates or Location say. Leave blank on every ordinary photo — most photos never need this." }
      - { label: "Internal ID", name: "id", widget: "string", required: false, hint: "Never shown on the site. Leave blank — it's set automatically from this entry's filename when the site rebuilds." }
      - { label: "Internal — added", name: "addedAt", widget: "string", required: false, hint: "Controls sort order in the archive (newest first). Leave blank on a new photo — it's filled in automatically." }
      - { label: "Numbered people (JSON)", name: "numberedPeople", widget: "text", required: false, hint: "Only for a group photo where people have been numbered for identification. Use the numbering tool at /admin/number-photo.html to click each person and copy the resulting JSON here. Leave blank otherwise." }

  # A single hand-curated list (data/chronology.json), not one file per
  # entry — same shape the old "Map pins" collection used before it was
  # removed from the admin (see js/map.js's own comment on that file).
  # Fits a village history list well: a few hundred entries at most,
  # small enough to load and edit as one whole list rather than needing
  # per-entry files plus a rebuild-and-aggregate script the way Photos
  # and Event Pages do. js/chronology.js reads this file directly.
  - name: "graves"
    label: "Cemetery"
    description: "One entry per headstone, listed on /cemetery.html. Each gets its own page, and the name(s) on it are searchable from the site-wide search box, same as photos and events."
    folder: "data/graves"
    create: true
    delete: true
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}-{{slug}}"
    extension: "json"
    format: "json"
    identifier_field: "name"
    fields:
      - { label: "Name(s) on the headstone", name: "name", widget: "string", hint: "As written on the stone. For a shared/family headstone with more than one name, list them all here, e.g. \"John Smith & Mary Smith\" — either name will be found by search." }
      - { label: "Grave number", name: "number", widget: "string", required: false, hint: "The number marked on or near this headstone, if numbered." }
      - { label: "Dates", name: "dates", widget: "string", required: false, hint: "e.g. \"1892–1964\" — as written on the stone, or whatever's known." }
      - label: "what3words address"
        name: "whatThreeWords"
        widget: "string"
        required: false
        hint: "The three-word address for this exact spot, e.g. \"index.home.raft\" — look it up once at what3words.com (search the map, or drop a pin), then paste just the three words here (no \"///\" needed). Leave blank if not yet recorded."
      - { label: "Inscription", name: "inscription", widget: "text", required: false, hint: "The wording on the headstone, if you'd like to record it in full." }
      - { label: "Notes", name: "notes", widget: "text", required: false, hint: "Anything else worth recording — family, history, how the grave was located." }
      - label: "Photo of the headstone"
        name: "photo"
        widget: "image"
        required: false
        media_folder: "/images/graves"
        public_folder: "/images/graves"
        hint: "Optional — a close-up photo of this headstone, if you have one."
      - { label: "Internal — added", name: "addedAt", widget: "string", required: false, hint: "Leave blank on a new entry — it's filled in automatically." }

  - name: "cemetery_overview"
    label: "Cemetery Overview Photo"
    description: "The single overview photo shown at the top of /cemetery.html — e.g. an aerial/drone shot of the cemetery. Optional; the page works fine without one."
    files:
      - name: "cemetery_overview"
        label: "Cemetery Overview Photo"
        file: "data/cemetery-overview.json"
        fields:
          - label: "Photo"
            name: "photo"
            widget: "image"
            required: false
            media_folder: "/images/cemetery"
            public_folder: "/images/cemetery"
            hint: "An overview photo of the cemetery — an aerial/drone shot works well. Leave blank to hide this section."
          - { label: "Caption", name: "caption", widget: "string", required: false, hint: "e.g. \"Aerial view of Thurmaston cemetery, 2026\"." }

