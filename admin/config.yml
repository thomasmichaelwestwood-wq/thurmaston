backend:
  name: git-gateway
  branch: main

# No editorial workflow (draft/review step) — matches the rest of the
# site's "single trusted uploader, no approval gate" approach. Saving in
# the CMS commits straight to `main` and Netlify redeploys automatically.
publish_mode: simple

# Any images uploaded directly through the CMS (not synced from Google
# Drive) land here, kept separate from the automated Drive→GitHub photo
# pipeline's own images/photos and images/hero-photos folders.
media_folder: "images/cms-uploads"
public_folder: "/images/cms-uploads"

collections:
  # Listed first deliberately — Decap opens the first collection in
  # this list by default when you log in, and Photos is what gets
  # used day to day.
  - name: "photos"
    label: "Photos"
    description: "Every photo in the archive, one entry per photo. Photos still sync in automatically from Google Drive as before — but you can also add one straight from here: upload the image, then fill in what you know. Edit caption, category, credit, location, and history freely on any photo; leave fields marked \"Internal\" alone unless you know what you're doing."
    folder: "data/photos"
    create: true
    delete: false
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}-{{slug}}"
    extension: "json"
    format: "json"
    identifier_field: "caption"
    # There's already a built-in search box at the top of this list (no
    # extra config needed — every folder collection gets one). These
    # two add quick category filter buttons and group entries by
    # category in the list, so the archive stays browsable once it's a
    # few hundred photos deep, not just searchable by caption text.
    view_filters:
      - { label: "Streets & Buildings", field: category, pattern: "streets" }
      - { label: "People & Events", field: category, pattern: "people" }
      - { label: "Nature & Views", field: category, pattern: "nature" }
      - { label: "Other", field: category, pattern: "other" }
    view_groups:
      - { label: "Category", field: category }
    fields:
      - label: "Photo"
        name: "src"
        widget: "image"
        media_folder: "/images/photos"
        public_folder: "/images/photos"
        hint: "For a new photo: upload the image file here. For an existing one, this shows the current image — leave it alone unless you're replacing the file."
      - { label: "Caption", name: "caption", widget: "muted-string", hint: "The photo's name, shown on the site. Usually fine as synced — tweak it if it reads oddly." }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Streets & Buildings", value: "streets" }
          - { label: "People & Events", value: "people" }
          - { label: "Nature & Views", value: "nature" }
          - { label: "Other", value: "other" }
      - { label: "Date", name: "date", widget: "muted-string", hint: "Shown under the photo, e.g. \"Added July 2026\" — replace with a real date if one becomes known, e.g. \"c.1936\"." }
      - { label: "Credit", name: "credit", widget: "muted-string", required: false, hint: "Who took or contributed the photo, if known." }
      - label: "Google Maps coordinates"
        name: "coords"
        widget: "muted-string"
        required: false
        hint: "On Google Maps, right-click the exact spot — the coordinates appear at the top of the menu that pops up. Click them to copy, then paste here, e.g. \"52.679363, -1.097994\". Leave blank if the location isn't known — this puts the photo on the map automatically, using this photo's own caption/date/credit. No need to also add a Map Pin for it — that's only for a pin that needs its own separate name/description."
        pattern: ['-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?', "Must be two numbers separated by a comma, e.g. 52.679363, -1.097994"]
      - { label: "Location", name: "location", widget: "muted-string", required: false, hint: "e.g. \"Garden Street\" — leave blank if not known. Just descriptive text shown next to the photo — set Google Maps coordinates above to actually place it on the map." }
      - { label: "History", name: "history", widget: "muted-text", required: false, hint: "What's known about this photo — shown in full when the photo is opened." }
      - label: "Document"
        name: "doc"
        widget: "file"
        media_folder: "/documents"
        public_folder: "/documents"
        required: false
        hint: "A linked PDF (newspaper clipping, record, etc.), if any. Usually set automatically by the Drive sync when a same-named PDF is uploaded alongside the photo — you very rarely need to touch this."
      - label: "Full story page"
        name: "pageSlug"
        widget: "relation"
        collection: "pages"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        required: false
        hint: "Optional — pick one of your Story pages to add a \"Read the full story\" button to this photo, AND show this photo's own caption/date/location/category/credit/history at the top of that page automatically (no need to retype any of that into the page itself — its \"Content\" is just for the extra story beyond those facts). Page you want isn't listed yet? Open the \"Story pages\" collection (left sidebar), create it there and save, then come back here and pick it — and don't forget this step, or the page and photo won't show each other's link."
      - { label: "Consent noted", name: "consentNoted", widget: "muted-boolean", default: false, hint: "Tick once you've confirmed it's OK to show identifiable people in this photo." }
      - { label: "Internal — reference code", name: "ref", widget: "muted-string", required: false, hint: "Shown as a small \"Ref:\" tag on the photo. For Drive-synced photos this is filled in automatically from Dad's original filing name. For a photo added here, it's filled in automatically from the uploaded file's name if you leave this blank." }
      - { label: "Internal ID", name: "id", widget: "muted-string", required: false, hint: "Never shown on the site. Leave blank — it's set automatically from this entry's filename when the site rebuilds." }
      - { label: "Internal — added", name: "addedAt", widget: "muted-string", required: false, hint: "Controls sort order in the archive (newest first). Leave blank on a new photo — it's filled in automatically." }

  - name: "pages"
    label: "Story pages"
    description: "Dedicated pages for buildings or places — linked from a map pin or a photo's \"Read full story\" button. That linked photo's own caption/date/location/category/credit/history already show automatically at the top of the page — no need to retype them here as Content, that's just for the extra story beyond those facts."
    folder: "data/pages"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    identifier_field: "title"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "e.g. \"The Generous Briton\"" }
      - label: "Content"
        name: "blocks"
        widget: "list"
        label_singular: "block"
        summary: "{{fields.type}}"
        types:
          - label: "Text"
            name: "text"
            widget: "object"
            fields:
              - label: "Text"
                name: "text"
                widget: "text"
                hint: "Leave a blank line between paragraphs. You can use **bold**, *italic*, and [link text](https://example.com) for links to other websites."
          - label: "Photo (from the archive)"
            name: "photo"
            widget: "object"
            fields:
              - label: "Photo"
                name: "photoId"
                widget: "relation"
                collection: "photos"
                search_fields: ["caption", "ref"]
                value_field: "{{slug}}"
                display_fields: ["caption"]
                hint: "Start typing a caption to search the archive and pick the photo this block should show. The preview on the right updates with the actual photo once you pick one."
          - label: "Document"
            name: "document"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string", hint: "e.g. \"Photograph record (1936)\"" }
              - label: "PDF file"
                name: "file"
                widget: "file"
                media_folder: "/documents"
                public_folder: "/documents"
                hint: "Pick an existing PDF already on the site, or upload a new one."

  - name: "map_pins"
    label: "Map pins"
    description: "The hand-picked pins on the historic map. Ordinary located photos already show up on the map automatically and don't need an entry here — this is only for pins with their own name and description."
    files:
      - name: "pins"
        label: "Map pins"
        file: "data/map-pins.json"
        fields:
          - label: "Pins"
            name: "pins"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Internal ID", name: "id", widget: "string", hint: "Unique, no spaces — never shown on the site, just used internally." }
              - { label: "Name", name: "name", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Streets & Buildings", value: "streets" }
                  - { label: "People & Events", value: "people" }
                  - { label: "Nature & Views", value: "nature" }
                  - { label: "Other", value: "other" }
              - label: "Google Maps coordinates"
                name: "coords"
                widget: "string"
                hint: "On Google Maps, right-click the exact spot — the coordinates appear at the top of the menu that pops up. Click them to copy, then paste here, e.g. \"52.679363, -1.097994\"."
                pattern: ['-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?', "Must be two numbers separated by a comma, e.g. 52.679363, -1.097994"]
              - { label: "Period / date", name: "period", widget: "string", hint: "e.g. \"Pictured c.1936\" or \"Exact date unknown\"" }
              - { label: "Location", name: "location", widget: "string", required: false, hint: "e.g. \"Garden Street\" — leave blank if not known." }
              - label: "Short description"
                name: "description"
                widget: "text"
                required: false
                hint: "Shown in the map pin's popup — keep it brief, the full story goes on the page below."
              - label: "Photo path"
                name: "photoSrc"
                widget: "string"
                required: false
                hint: "e.g. images/photos/xxxxxxxx-name.jpg — copy the \"src\" from that photo's entry."
              - label: "Photo ID"
                name: "photoId"
                widget: "string"
                required: false
                hint: "Must match that photo's ID exactly, so the popup photo links into the archive correctly."
              - label: "Full story page"
                name: "pageSlug"
                widget: "relation"
                collection: "pages"
                search_fields: ["title"]
                value_field: "{{slug}}"
                display_fields: ["title"]
                required: false
                hint: "Optional — pick one of your Story pages to add a \"Read the full story\" link to this pin's popup."
