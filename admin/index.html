<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Manager | Memories of Thurmaston</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", function (user) {
      if (!user) {
        window.netlifyIdentity.on("login", function () {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>

<script>
  // Live preview pane, styled to actually look like the real site rather
  // than a generic form dump — updates as you type, no need to save first.
  // Loads the site's own stylesheet into the preview iframe so fonts,
  // colours and spacing match the live pages.
  CMS.registerPreviewStyle("/css/style.css");

  // Mirrors the small markdown-lite renderer in js/place.js
  // (renderTextBlock/renderInline) — kept in sync by hand since this runs
  // in the CMS preview iframe, not on the real site, so it can't just
  // import that file. If you change one, check the other.
  function escapeHtmlPreview(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
  function renderInlinePreview(text) {
    text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (match, label, url) {
      if (/^javascript:/i.test(url)) return label;
      return '<a href="' + url.replace(/"/g, "&quot;") + '">' + label + "</a>";
    });
    text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    text = text.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    return text;
  }
  function renderTextBlockPreview(rawText) {
    var escaped = escapeHtmlPreview(rawText || "");
    return escaped.split(/\n{2,}/).map(function (para) {
      return "<p>" + renderInlinePreview(para).replace(/\n/g, "<br>") + "</p>";
    }).join("");
  }

  var PagePreview = createClass({
    getInitialState: function () {
      return { photos: [] };
    },
    componentDidMount: function () {
      var self = this;
      // no-store: this only fetches once per mount, so a cached response
      // (from an earlier page load, possibly before a newly-added photo
      // existed) would otherwise stick around as "Photo not found" for
      // the rest of the editing session even though the real data is fine.
      fetch("/data/photos.json", { cache: "no-store" }).then(function (res) { return res.json(); }).then(function (photos) {
        self.setState({ photos: photos });
      }).catch(function () {});
    },
    render: function () {
      var entry = this.props.entry;
      var title = entry.getIn(["data", "title"]) || "Untitled page";
      var blocks = entry.getIn(["data", "blocks"]);
      var photos = this.state.photos;

      return h("div", {},
        h("section", { className: "page-hero" },
          h("div", { className: "container" },
            h("h1", {}, title)
          )
        ),
        h("section", { className: "content-section container" },
          h("div", { className: "place-content" },
            blocks ? blocks.map(function (block, i) {
              var type = block.get("type");
              if (type === "text") {
                return h("div", { key: i, dangerouslySetInnerHTML: { __html: renderTextBlockPreview(block.get("text")) } });
              }
              if (type === "photo") {
                var photoId = block.get("photoId");
                var photo = photos.filter(function (p) { return p.id === photoId; })[0];
                if (!photo) return h("p", { key: i, style: { color: "#a33" } }, "Photo not found for ID: " + photoId);
                return h("a", { key: i, className: "place-photo-block" },
                  h("img", { src: photo.src, alt: photo.caption }),
                  h("span", { className: "place-photo-caption" }, photo.caption)
                );
              }
              if (type === "document") {
                return h("a", { key: i, className: "place-doc-block" }, block.get("label") || "View document");
              }
              return null;
            }).toArray() : null
          )
        )
      );
    }
  });
  CMS.registerPreviewTemplate("pages", PagePreview);

  // Muted/greyed field widgets — for fields on the Photos collection
  // that are usually fine left as they are (set automatically by the
  // Drive sync, or rarely worth changing), so the one field that
  // always needs an active decision (Category) stands out instead of
  // competing with a form full of equally-weighted boxes. Built as
  // real widgets via CMS.registerWidget, a core stable part of Decap's
  // API, rather than trying to reach into and restyle Decap's own
  // built-in field markup — that's not something Decap exposes a
  // stable hook for, only custom widgets we write ourselves are ours
  // to style. Only used for plain text/textarea/checkbox fields; the
  // Photo and Document fields keep Decap's real upload widgets
  // untouched rather than risk breaking the upload path over styling.
  var MUTED_INPUT_STYLE = {
    background: "#f1efe6",
    color: "#8c8775",
    border: "1px solid #e2ddc9"
  };

  var MutedStringControl = createClass({
    handleChange: function (e) {
      this.props.onChange(e.target.value);
    },
    render: function () {
      return h("input", {
        id: this.props.forID,
        className: this.props.classNameWrapper,
        type: "text",
        value: this.props.value || "",
        onChange: this.handleChange,
        style: MUTED_INPUT_STYLE
      });
    }
  });
  CMS.registerWidget("muted-string", MutedStringControl);

  var MutedTextControl = createClass({
    handleChange: function (e) {
      this.props.onChange(e.target.value);
    },
    render: function () {
      return h("textarea", {
        id: this.props.forID,
        className: this.props.classNameWrapper,
        rows: 4,
        value: this.props.value || "",
        onChange: this.handleChange,
        style: MUTED_INPUT_STYLE
      });
    }
  });
  CMS.registerWidget("muted-text", MutedTextControl);

  var MutedBooleanControl = createClass({
    handleChange: function (e) {
      this.props.onChange(e.target.checked);
    },
    render: function () {
      return h("label", { style: { display: "flex", alignItems: "center", gap: "8px" } },
        h("input", {
          id: this.props.forID,
          type: "checkbox",
          checked: !!this.props.value,
          onChange: this.handleChange
        }),
        h("span", { style: { fontSize: "0.85rem", color: MUTED_INPUT_STYLE.color } }, "Usually fine left as-is")
      );
    }
  });
  CMS.registerWidget("muted-boolean", MutedBooleanControl);

  var MapPinsPreview = createClass({
    render: function () {
      var pins = this.props.entry.getIn(["data", "pins"]);
      return h("div", { className: "container", style: { padding: "20px" } },
        pins ? pins.map(function (pin, i) {
          return h("div", {
            key: i,
            className: "map-popup",
            style: { border: "1px solid #ddd", borderRadius: "10px", padding: "14px", margin: "0 0 16px", maxWidth: "300px" }
          },
            h("span", { className: "map-popup-cat" }, pin.get("category")),
            h("h3", {}, pin.get("name") || "Untitled pin"),
            pin.get("photoSrc") ? h("img", { src: pin.get("photoSrc"), style: { width: "100%", borderRadius: "6px", display: "block", margin: "6px 0" } }) : null,
            h("p", { className: "map-popup-period" }, [pin.get("period"), pin.get("location")].filter(Boolean).join(" · ")),
            pin.get("description") ? h("p", {}, pin.get("description")) : null,
            pin.get("pageSlug") ? h("a", { className: "map-popup-page-link" }, "Read the full story →") : null
          );
        }).toArray() : null
      );
    }
  });
  CMS.registerPreviewTemplate("map_pins", MapPinsPreview);

  // Mirrors the real photo lightbox (see index.html's #photo-lightbox and
  // js/photos.js's showPhoto) so editing a photo's caption, location or
  // history here shows exactly what visitors will see.
  var PhotosPreview = createClass({
    render: function () {
      var data = this.props.entry.get("data");
      var caption = data.get("caption") || "Untitled photo";
      var date = data.get("date");
      var location = data.get("location");
      var history = data.get("history");
      var ref = data.get("ref");
      var credit = data.get("credit");
      var src = data.get("src");

      return h("div", { className: "photo-lightbox open", style: { position: "static", background: "none" } },
        h("div", { className: "photo-lightbox-inner" },
          h("div", { className: "photo-lightbox-media" },
            src ? h("img", { className: "photo-lightbox-img", src: "/" + src, alt: caption }) : null
          ),
          h("div", { className: "photo-lightbox-info" },
            h("p", { className: "photo-lightbox-caption" }, caption),
            h("p", { className: "photo-lightbox-datelocation" }, [date, location].filter(Boolean).join(" · ")),
            credit ? h("p", { className: "photo-lightbox-meta" }, "Credit: " + credit) : null,
            history ? h("p", { className: "photo-lightbox-history visible" }, history) : null,
            ref ? h("p", { className: "photo-lightbox-ref visible" }, "Ref: " + ref) : null
          )
        )
      );
    }
  });
  CMS.registerPreviewTemplate("photos", PhotosPreview);

  // Edit log — a plain read-only history of changes to the site's
  // content, pulled from GitHub's commit history (every CMS save is a
  // commit, so this is "for free" — no separate log to maintain). Only
  // reachable from inside this logged-in admin, via a link Decap adds
  // to its own sidebar; it's not linked from anywhere on the public
  // site and never runs there. Wrapped in a feature check since
  // registerAdditionalLink is a newer, less-documented part of Decap's
  // API — if it's missing in whatever version loads, this just quietly
  // does nothing rather than breaking the rest of the admin.
  if (typeof CMS.registerAdditionalLink === "function") {
    var EditLog = createClass({
      getInitialState: function () {
        return { commits: null, error: null };
      },
      componentDidMount: function () {
        var self = this;
        fetch("https://api.github.com/repos/thomasmichaelwestwood-wq/thurmaston/commits?per_page=50")
          .then(function (res) {
            if (!res.ok) throw new Error("GitHub returned " + res.status);
            return res.json();
          })
          .then(function (commits) { self.setState({ commits: commits }); })
          .catch(function (err) { self.setState({ error: err.message }); });
      },
      render: function () {
        if (this.state.error) {
          return h("div", { style: { padding: "30px", fontFamily: "sans-serif" } },
            "Couldn't load the edit log: " + this.state.error);
        }
        if (!this.state.commits) {
          return h("div", { style: { padding: "30px", fontFamily: "sans-serif" } }, "Loading…");
        }
        return h("div", { style: { padding: "30px", maxWidth: "760px", fontFamily: "sans-serif" } },
          h("h1", {}, "Edit log"),
          h("p", { style: { color: "#666" } },
            "Every save made here, and every photo synced from Google Drive, shows up as a change below. This page is only visible to logged-in editors — it's never shown on the public site."),
          h("ul", { style: { listStyle: "none", padding: 0, margin: 0 } },
            this.state.commits.map(function (c) {
              var message = c.commit.message.split("\n")[0];
              var author = (c.commit.author && c.commit.author.name) || "Unknown";
              var date = c.commit.author ? new Date(c.commit.author.date).toLocaleString() : "";
              return h("li", { key: c.sha, style: { borderBottom: "1px solid #eee", padding: "12px 0" } },
                h("div", { style: { fontWeight: 600 } }, message),
                h("div", { style: { fontSize: "0.85em", color: "#888" } },
                  author + " · " + date + " · ",
                  h("a", { href: c.html_url, target: "_blank", rel: "noopener" }, "view on GitHub")
                )
              );
            })
          )
        );
      }
    });

    CMS.registerAdditionalLink({
      id: "edit-log",
      title: "Edit log",
      data: EditLog,
      options: { icon: "page" }
    });
  }
</script>
</body>
</html>
