<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Manager | Memories of Thurmaston</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<!-- Sveltia's plain "text" field (History, Description) has no
     widget-level option for its box size — Decap-compatible "text"
     fields never had one either, it's just whatever height the native
     <textarea> element defaults to. This plain CSS override (not a
     custom widget/registration API, which Sveltia doesn't support yet
     — see the script comment below) makes every one of those bigger by
     default, since History routinely holds several paragraphs. Safe
     even if Sveltia's internal markup ever changes: an unmatched
     selector just does nothing, it can't break the admin the way a
     failed widget registration can. -->
<style>
textarea { min-height: 220px !important; }
</style>
</head>
<body>
<!-- A plain link back to the live homepage, floated above whatever the
     CMS renders. A real anchor tag sitting in the page's own DOM, styled
     with a fixed position and a high z-index, can't be swallowed by the
     CMS mounting its own UI into the page — it doesn't wipe out sibling
     elements that were already there. -->
<a href="/index.html" id="back-to-site-link" style="position:fixed;bottom:16px;left:16px;z-index:99999;background:#1f4d3a;color:#fff;padding:8px 16px;border-radius:8px;font:600 13px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.3);">← Back to site</a>
<!-- Sveltia CMS — switched from Decap CMS specifically because Decap's
     media library doesn't reliably support selecting/uploading several
     images at once (confirmed both in testing and in Decap's own open
     GitHub issues), which Event Pages needs for its Photos field. Same
     config.yml format as Decap (this migration needed no schema
     changes), but two real differences worth knowing:
      - Backend is a direct GitHub OAuth connection now, not Git Gateway/
        Netlify Identity — Sveltia doesn't support Git Gateway. Login
        now goes through GitHub instead. See admin/config.yml's backend
        block comment for the one-time Netlify/GitHub OAuth App setup
        this needed (an account-level step, not anything in this repo).
      - The "muted/greyed" styling previously used for fields that don't
        usually need touching (a custom Decap widget, registered via
        CMS.registerWidget in this file) has been dropped, along with
        the custom photo-preview pane and the Edit log page — Sveltia
        doesn't support custom field types yet (an open feature
        request, not implemented). Every field is a plain, unstyled
        input now. This was a deliberate trade accepted for reliable
        bulk photo upload, not an oversight — the fields themselves
        (names, hints, what's optional) are all unchanged.
     No type="module" needed — Sveltia CMS isn't distributed as an ES
     module — and no separate stylesheet to add, its CSS is bundled
     into the one script file. -->
<script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</body>
</html>
